<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Throughline">
  <!-- A strip in its holder, cocked 2.5 degrees: the mark is the product's own device. -->
  <rect width="32" height="32" fill="#2e4b3c"/>
  <g transform="rotate(2.5 6 16)">
    <rect x="4" y="9" width="4" height="14" fill="#f0a23c"/>
    <rect x="8" y="9" width="20" height="14" fill="#ede4c9"/>
    <rect x="11" y="12" width="14" height="1.6" fill="#5f5b4c"/>
    <rect x="11" y="15.4" width="10" height="1.6" fill="#5f5b4c"/>
    <rect x="11" y="18.8" width="12" height="1.6" fill="#5f5b4c"/>
  </g>
</svg>
